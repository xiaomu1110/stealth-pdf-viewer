<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#1e222b" />
      <stop offset="100%" stop-color="#14161b" />
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282c34" />
      <stop offset="100%" stop-color="#21252b" />
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e4451" />
      <stop offset="100%" stop-color="#2c313a" />
    </linearGradient>

    <!-- Visor / Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#00e699" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" />
      <stop offset="100%" stop-color="#d03543" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile with Squircle -->
  <rect width="256" height="256" rx="54" fill="url(#bgGrad)" stroke="#303642" stroke-width="2.5" />

  <!-- Background subtle code grid/telemetry lines -->
  <g opacity="0.12" stroke="#61afef" stroke-width="1.2">
    <line x1="28" y1="64" x2="228" y2="64" />
    <line x1="28" y1="128" x2="228" y2="128" />
    <line x1="28" y1="192" x2="228" y2="192" />
    <line x1="64" y1="28" x2="64" y2="228" />
    <line x1="128" y1="28" x2="128" y2="228" />
    <line x1="192" y1="28" x2="192" y2="228" />
  </g>

  <!-- PDF Document Sheet with Folded Corner -->
  <g filter="url(#dropShadow)">
    <path d="M 64 42
             L 156 42
             L 192 78
             L 192 206
             A 10 10 0 0 1 182 216
             L 74 216
             A 10 10 0 0 1 64 206
             Z"
          fill="url(#docGrad)"
          stroke="#3d4452"
          stroke-width="2" />
    <!-- Fold Corner -->
    <path d="M 156 42 L 156 74 A 4 4 0 0 0 160 78 L 192 78 Z"
          fill="url(#foldGrad)"
          stroke="#4b5263"
          stroke-width="1.5" />
  </g>

  <!-- Top Metrics / Telemetry Graph line (Developer Disguise) -->
  <g opacity="0.85">
    <polyline points="80,96 100,96 108,86 116,104 124,96 142,96 148,90 154,96 176,96"
              fill="none"
              stroke="#61afef"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
    <circle cx="108" cy="86" r="2.5" fill="#58a6ff" />
    <circle cx="154" cy="96" r="2.5" fill="#98c379" />
  </g>

  <!-- Stealth / Incognito Visor with subtle mask slits -->
  <g filter="url(#neonGlow)">
    <!-- Visor bar -->
    <rect x="80" y="120" width="96" height="24" rx="12" fill="#14171d" stroke="#2c323d" stroke-width="1.5" />
    <!-- Glowing Visor Eye Aperture -->
    <path d="M 88 132 Q 106 127 124 132 Q 128 133 132 132 Q 150 127 168 132 Q 150 137 132 132 Q 128 131 124 132 Q 106 137 88 132 Z"
          fill="url(#glowGrad)" />
    <!-- Visor glint dot -->
    <circle cx="108" cy="132" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="148" cy="132" r="2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Code annotation bracket lines (representing exercise notes) -->
  <g stroke="#98c379" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="82" y1="162" x2="114" y2="162" />
    <line x1="82" y1="176" x2="132" y2="176" />
  </g>
  <g stroke="#e5c07b" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="122" y1="162" x2="152" y2="162" stroke-dasharray="3 3" />
  </g>

  <!-- Red Pen / Stylus tool (Brush for doing exams) -->
  <g transform="translate(142, 142) rotate(42)" filter="url(#dropShadow)">
    <!-- Pen barrel -->
    <rect x="0" y="0" width="14" height="46" rx="4" fill="url(#penGrad)" stroke="#ffa198" stroke-width="1" />
    <!-- Pen grip band -->
    <rect x="0" y="32" width="14" height="5" fill="#30363d" />
    <!-- Pen Nib cone -->
    <polygon points="1,46 13,46 7,58" fill="#e5c07b" stroke="#d29922" stroke-width="0.8" />
    <!-- Pen Nib point -->
    <polygon points="5.5,55 8.5,55 7,60" fill="#30363d" />
  </g>

  <!-- Fluorescent ink sweep line from the pen nib -->
  <path d="M 172 202 Q 160 206 142 204 Q 122 201 106 205"
        fill="none"
        stroke="#e06c75"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.9" />
</svg>
